spring.application.name=agroorbit
server.port=${SERVER_PORT:8080}

# Profile Docker/Cloud - PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/agroorbit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html

# JWT
api.security.token.secret=${JWT_SECRET:agroorbit-secret-key-cloud}

# Actuator para healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
